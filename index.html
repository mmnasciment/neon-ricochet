<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Neon Ricochet 1v1 - Online v3</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0c0e18;
      color: #f0f5ff;
      font-family: Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    #hud {
      width: 860px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }
    .p1-txt { color: #00dcff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p2-txt { color: #ff4664; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .center-hud {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #151a2e;
      border: 1px solid #364670;
      padding: 6px 14px;
      border-radius: 99px;
    }
    #scoreBoard { font-size: 15px; color: #ffffff; letter-spacing: 0.5px; }
    .divider { color: #4a5a85; }
    #pingBadge {
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #1f2742;
      color: #8fa4d4;
    }
    .ping-good { color: #50fa7b !important; }
    .ping-mid  { color: #ffd73c !important; }
    .ping-bad  { color: #ff6b6b !important; }

    #wrapper { position: relative; width: 860px; height: 540px; }
    canvas {
      background: #121624;
      border: 3px solid #5a73aa;
      border-radius: 8px;
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 24, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      border-radius: 8px;
    }
    h1 { font-size: 28px; letter-spacing: 1px; color: #00dcff; }
    p { font-size: 13px; color: #b8c4e0; max-width: 600px; line-height: 1.5; }
    .status { color: #ffd73c; font-weight: bold; font-size: 15px; max-width: 650px; min-height: 22px; }
    .route-badge {
      font-size: 12px;
      color: #8fa4d4;
      background: #1a2138;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid #364670;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin: 4px 0;
    }
    .input-group label { font-size: 13px; color: #9fb0d9; text-align: left; }
    input[type="text"] {
      user-select: text;
      background: #171d33;
      border: 2px solid #45598a;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      outline: none;
    }
    input[type="text"]:focus { border-color: #00dcff; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    button {
      background: #00dcff;
      color: #0c0e18;
      border: none;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.92; transform: translateY(-1px); }
    button:disabled { background: #3a4562; color: #8892b0; cursor: not-allowed; transform: none; }
    button.secondary { background: #2d3755; color: #f0f5ff; border: 1px solid #5a73aa; }
  </style>
</head>
<body>

  <div id="hud">
    <span class="p1-txt" id="hudP1">JOGADOR 1: 5 HP</span>
    <div class="center-hud">
      <span id="scoreBoard">JOGADOR 1 0 &times; 0 JOGADOR 2</span>
      <span class="divider">|</span>
      <span id="pingBadge">Ping: -- ms</span>
    </div>
    <span class="p2-txt" id="hudP2">JOGADOR 2: 5 HP</span>
  </div>

  <div id="wrapper">
    <canvas id="game" width="860" height="540"></canvas>

    <div id="overlay">
      <h1>NEON RICOCHET 1v1 <span style="font-size:16px;color:#50fa7b;">v3</span></h1>
      <div class="route-badge" id="routeTxt">Inicializando rede...</div>
      <div class="status" id="statusTxt">Conectando...</div>

      <div class="input-group">
        <label id="nameLabel" for="nameInput">Seu Nome:</label>
        <input type="text" id="nameInput" maxlength="14" placeholder="Digite seu nome..." autocomplete="off" />
      </div>

      <div class="input-group" id="localP2Group" style="display:none;">
        <label for="nameInputP2">Nome do Jogador 2 (Setas):</label>
        <input type="text" id="nameInputP2" maxlength="14" placeholder="Nome do Jogador 2..." autocomplete="off" />
      </div>

      <div class="btn-row" id="hostActions">
        <button id="copyBtn" disabled>Conectando...</button>
        <button id="switchRouteBtn" class="secondary">Trocar Rota</button>
        <button id="localBtn" class="secondary">Mesmo PC</button>
      </div>

      <div class="btn-row" id="guestActions" style="display:none;">
        <button id="joinBtn" disabled>Conectando à sala...</button>
      </div>

      <p>
        Controles Online: <b>WASD</b> ou <b>Setas</b> para mover &bull; <b>F</b>, <b>Numpad 1</b> ou <b>Shift Direito</b> para atirar.
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const statusTxt = document.getElementById('statusTxt');
    const routeTxt = document.getElementById('routeTxt');
    const nameInput = document.getElementById('nameInput');
    const nameLabel = document.getElementById('nameLabel');
    const localP2Group = document.getElementById('localP2Group');
    const nameInputP2 = document.getElementById('nameInputP2');
    const copyBtn = document.getElementById('copyBtn');
    const switchRouteBtn = document.getElementById('switchRouteBtn');
    const localBtn = document.getElementById('localBtn');
    const hostActions = document.getElementById('hostActions');
    const guestActions = document.getElementById('guestActions');
    const joinBtn = document.getElementById('joinBtn');
    const hudP1 = document.getElementById('hudP1');
    const hudP2 = document.getElementById('hudP2');
    const scoreBoard = document.getElementById('scoreBoard');
    const pingBadge = document.getElementById('pingBadge');

    const W = canvas.width;
    const H = canvas.height;
    const SPEED = 265;
    const BULLET_SPEED = 520;

    const OBSTACLES = [
      { x: 190, y: 110, w: 44, h: 105 },
      { x: 190, y: 325, w: 44, h: 105 },
      { x: 626, y: 110, w: 44, h: 105 },
      { x: 626, y: 325, w: 44, h: 105 },
      { x: 408, y: 215, w: 44, h: 110 }
    ];

    const BROKERS = [
      { name: 'Rota 1 - Porta 443', url: 'wss://mqtt.eclipseprojects.io:443/mqtt' },
      { name: 'Rota 2 - EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
      { name: 'Rota 3 - HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' }
    ];

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function safeGet(store, k, def = '') {
      try { return store.getItem(k) || def; } catch (_) { return def; }
    }
    function safeSet(store, k, v) {
      try { store.setItem(k, v); } catch (_) {}
    }

    const params = new URLSearchParams(window.location.search);
    const guestRoomParam = params.get('sala');
    const isGuest = Boolean(guestRoomParam);
    const myId = isGuest ? 2 : 1;
    let brokerIdx = Math.min(BROKERS.length - 1, Math.max(0, parseInt(params.get('b') || '0', 10) || 0));

    let roomId = guestRoomParam || safeGet(sessionStorage, 'nr_room_v3');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
      safeSet(sessionStorage, 'nr_room_v3', roomId);
    }

    const topicC2H = `neonricochet_v3/${roomId}/c2h`;
    const topicH2C = `neonricochet_v3/${roomId}/h2c`;
    const mySessionSid = Math.random().toString(36).substring(2, 9);
    let activeGuestSid = '';

    // Preenche nome salvo se existir
    nameInput.value = safeGet(localStorage, isGuest ? 'nr_name_p2' : 'nr_name_p1', '');
    nameInputP2.value = safeGet(localStorage, 'nr_name_local_p2', '');

    let mode = 'MENU'; // MENU, ONLINE, LOCAL
    let wssConnected = false;
    let guestWantsJoin = false;
    let localSetupOpen = false;
    let inviteUrl = '';

    // Estado de rede
    let mqttClient = null;
    let fallbackTimer = null;
    let pc = null;
    let fastDC = null;
    let relDC = null;
    let pendingIce = [];
    let p2pReady = false;
    let lastFastRecv = 0;
    let pingMs = null;

    // Estado da partida
    let roundId = 1;
    let moveSeq = 0;
    let bulletSeq = 0;
    let wins = { p1: 0, p2: 0 };
    let winner = 0;
    let p1, p2, bullets = [], sparks = [];

    function cleanName(raw, fallback) {
      const trimmed = (raw || '').trim().slice(0, 14);
      return trimmed || fallback;
    }

    function makePlayer(id, x, y, aimX, color, name) {
      return {
        id, name, x, y, netX: x, netY: y, vx: 0, vy: 0,
        r: 16, aimX, aimY: 0, color,
        hp: 5, ammo: 3, maxAmmo: 3, reloadTimer: 0,
        fireCd: 0, invuln: 0,
        lastSeq: 0, lastPktTime: performance.now()
      };
    }

    function initPlayers() {
      const n1 = p1 ? p1.name : cleanName(nameInput.value, 'Jogador 1');
      const n2 = p2 ? p2.name : 'Jogador 2';
      p1 = makePlayer(1, 90, H / 2, 1, '#00dcff', n1);
      p2 = makePlayer(2, W - 90, H / 2, -1, '#ff4664', n2);
      bullets = [];
      sparks = [];
      winner = 0;
      moveSeq = 0;
      updateHud();
    }
    initPlayers();

    function spawnSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 170;
        sparks.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color,
          life: 0.28,
          maxLife: 0.28
        });
      }
    }

    function updateHud() {
      hudP1.textContent = `${p1.name}: ${p1.hp} HP`;
      hudP2.textContent = `${p2.name}: ${p2.hp} HP`;
      scoreBoard.textContent = `${p1.name} ${wins.p1} × ${wins.p2} ${p2.name}`;

      pingBadge.classList.remove('ping-good', 'ping-mid', 'ping-bad');
      if (mode === 'LOCAL') {
        pingBadge.textContent = 'Local (0 ms)';
        pingBadge.classList.add('ping-good');
      } else if (pingMs === null) {
        pingBadge.textContent = 'Ping: -- ms';
      } else {
        const tag = p2pReady ? '⚡ P2P' : '🌐 WSS';
        pingBadge.textContent = `${tag}: ${pingMs} ms`;
        if (pingMs < 50) pingBadge.classList.add('ping-good');
        else if (pingMs <= 120) pingBadge.classList.add('ping-mid');
        else pingBadge.classList.add('ping-bad');
      }
    }

    // Controle de Teclado (ignora quando estiver digitando nos inputs de nome)
    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        if (e.code === 'Enter') {
          if (isGuest && !joinBtn.disabled) joinBtn.click();
          else if (!isGuest && localSetupOpen) localBtn.click();
          else if (!isGuest && !copyBtn.disabled) copyBtn.click();
        }
        return;
      }

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;
      if (e.repeat) return;

      const isP1Act = e.code === 'KeyF';
      const isP2Act = e.code === 'Numpad1' || e.code === 'ShiftRight';
      const isAnyAct = isP1Act || isP2Act;

      if (mode === 'LOCAL') {
        if (isP1Act && !winner) shootBullet(p1, false);
        if (isP2Act && !winner) shootBullet(p2, false);
        if (e.code === 'KeyR' && winner) {
          roundId++;
          initPlayers();
        }
      } else if (mode === 'ONLINE') {
        const me = myId === 1 ? p1 : p2;
        if (isAnyAct && !winner) shootBullet(me, true);
        if (e.code === 'KeyR' && winner) {
          if (myId === 1) startNextOnlineRound();
          else sendReliable({ t: 'req_round' });
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function getCombinedInput() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      return { dx, dy };
    }

    // Transporte Híbrido: MQTT WSS + Upgrade Automático para WebRTC P2P UDP
    function sendMqtt(obj) {
      if (mqttClient && mqttClient.connected) {
        const outTopic = isGuest ? topicC2H : topicH2C;
        mqttClient.publish(outTopic, JSON.stringify(obj), { qos: 0 });
      }
    }

    function sendFast(obj) {
      if (p2pReady && fastDC && fastDC.readyState === 'open') {
        try { fastDC.send(JSON.stringify(obj)); return; } catch (_) {}
      }
      sendMqtt(obj);
    }

    function sendReliable(obj) {
      if (p2pReady && relDC && relDC.readyState === 'open') {
        try { relDC.send(JSON.stringify(obj)); return; } catch (_) {}
      }
      sendMqtt(obj);
    }

    function closeWebRTC() {
      p2pReady = false;
      pendingIce = [];
      if (fastDC) { try { fastDC.close(); } catch (_) {} fastDC = null; }
      if (relDC) { try { relDC.close(); } catch (_) {} relDC = null; }
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    }

    function bindFastChannel(ch) {
      fastDC = ch;
      ch.onmessage = (ev) => {
        lastFastRecv = performance.now();
        let data;
        try { data = JSON.parse(ev.data); } catch (_) { return; }
        if (data.t === 'p2p_probe') {
          p2pReady = true;
          try { ch.send(JSON.stringify({ t: 'p2p_ack', ts: data.ts })); } catch (_) {}
          return;
        }
        if (data.t === 'p2p_ack') {
          p2pReady = true;
          pingMs = Math.max(1, Math.round(performance.now() - data.ts));
          updateHud();
          return;
        }
        handleGamePacket(data);
      };
      ch.onclose = () => { p2pReady = false; updateHud(); };
    }

    function bindRelChannel(ch) {
      relDC = ch;
      ch.onmessage = (ev) => {
        try { handleGamePacket(JSON.parse(ev.data)); } catch (_) {}
      };
    }

    function setupPeerConnection() {
      closeWebRTC();
      try {
        pc = new RTCPeerConnection(ICE_CONFIG);
      } catch (_) {
        return null;
      }

      pc.onicecandidate = (ev) => {
        if (ev.candidate) {
          sendMqtt({ t: 'rtc_ice', sid: isGuest ? mySessionSid : activeGuestSid, cand: ev.candidate });
        }
      };

      if (!isGuest) {
        bindFastChannel(pc.createDataChannel('fast', { ordered: false, maxRetransmits: 0 }));
        bindRelChannel(pc.createDataChannel('rel', { ordered: true }));
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .then(() => {
            sendMqtt({ t: 'rtc_offer', sid: activeGuestSid, sdp: pc.localDescription });
          })
          .catch(() => {});
      } else {
        pc.ondatachannel = (ev) => {
          if (ev.channel.label === 'fast') bindFastChannel(ev.channel);
          if (ev.channel.label === 'rel') bindRelChannel(ev.channel);
        };
      }
      return pc;
    }

    function flushIceQueue() {
      if (!pc || !pc.remoteDescription) return;
      while (pendingIce.length > 0) {
        const c = pendingIce.shift();
        pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      }
    }

    // Tratamento de pacotes de jogo e sinalização
    function handleSignalingAndLobby(data) {
      if (!isGuest) {
        if (data.t === 'join') {
          const isNewSession = data.sid !== activeGuestSid;
          activeGuestSid = data.sid;
          p1.name = cleanName(nameInput.value, 'Jogador 1');
          p2.name = cleanName(data.name, 'Jogador 2');

          if (mode !== 'ONLINE' || isNewSession) {
            mode = 'ONLINE';
            nameInput.blur();
            overlay.style.display = 'none';
            document.title = `🟢 ${p1.name} vs ${p2.name}`;
            roundId++;
            initPlayers();
            setupPeerConnection();
          }

          sendMqtt({
            t: 'welcome',
            sid: activeGuestSid,
            hostName: p1.name,
            guestName: p2.name,
            wins,
            rId: roundId
          });
          return true;
        }
        if (data.t === 'rtc_ans' && data.sid === activeGuestSid && pc) {
          pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
            .then(flushIceQueue)
            .catch(() => {});
          return true;
        }
        if (data.t === 'rtc_ice' && data.sid === activeGuestSid && pc) {
          if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(data.cand)).catch(() => {});
          else pendingIce.push(data.cand);
          return true;
        }
      } else {
        if (data.t === 'welcome' && data.sid === mySessionSid) {
          p1.name = cleanName(data.hostName, 'Jogador 1');
          p2.name = cleanName(data.guestName, cleanName(nameInput.value, 'Jogador 2'));
          wins = data.wins || wins;
          if (mode !== 'ONLINE' || roundId !== data.rId) {
            roundId = data.rId;
            mode = 'ONLINE';
            guestWantsJoin = false;
            nameInput.blur();
            overlay.style.display = 'none';
            document.title = `🟢 ${p1.name} vs ${p2.name}`;
            initPlayers();
          }
          updateHud();
          return true;
        }
        if (data.t === 'rtc_offer' && data.sid === mySessionSid) {
          const peerConn = setupPeerConnection();
          if (peerConn) {
            peerConn.setRemoteDescription(new RTCSessionDescription(data.sdp))
              .then(() => {
                flushIceQueue();
                return peerConn.createAnswer();
              })
              .then((ans) => peerConn.setLocalDescription(ans))
              .then(() => {
                sendMqtt({ t: 'rtc_ans', sid: mySessionSid, sdp: peerConn.localDescription });
              })
              .catch(() => {});
          }
          return true;
        }
        if (data.t === 'rtc_ice' && data.sid === mySessionSid && pc) {
          if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(data.cand)).catch(() => {});
          else pendingIce.push(data.cand);
          return true;
        }
      }
      return false;
    }

    function handleGamePacket(data) {
      if (handleSignalingAndLobby(data)) return;

      if (data.t === 'ping') {
        sendFast({ t: 'pong', ts: data.ts });
        return;
      }
      if (data.t === 'pong') {
        pingMs = Math.max(1, Math.round(performance.now() - data.ts));
        updateHud();
        return;
      }

      if (mode !== 'ONLINE') return;
      const them = myId === 1 ? p2 : p1;

      if (data.t === 'm') {
        if (data.r !== roundId || data.s <= them.lastSeq) return;
        them.lastSeq = data.s;
        them.lastPktTime = performance.now();
        them.netX = data.x;
        them.netY = data.y;
        them.vx = data.vx;
        them.vy = data.vy;
        them.aimX = data.ax;
        them.aimY = data.ay;
        them.ammo = data.am;
        them.invuln = data.inv;
      } else if (data.t === 'fire') {
        if (data.rId !== roundId || bullets.some((b) => b.id === data.id)) return;
        const nb = {
          id: data.id,
          rId: data.rId,
          x: data.x,
          y: data.y,
          vx: data.vx,
          vy: data.vy,
          owner: data.owner,
          color: data.owner === 1 ? '#00dcff' : '#ff4664',
          bounces: 1,
          r: 5
        };
        // Avança suavemente metade do ping para compensar o trânsito de rede
        if (pingMs !== null) {
          const catchUp = Math.min(0.055, pingMs / 2000);
          if (catchUp > 0.004) stepSingleBullet(nb, catchUp);
        }
        bullets.push(nb);
      } else if (data.t === 'hit') {
        if (data.rId !== roundId) return;
        const idx = bullets.findIndex((b) => b.id === data.bId);
        if (idx !== -1) bullets.splice(idx, 1);
        const victim = data.target === 1 ? p1 : p2;
        victim.hp = data.hp;
        victim.invuln = 0.45;
        spawnSparks(victim.x, victim.y, victim.color, 12);
        updateHud();
      } else if (data.t === 'ko') {
        if (data.rId !== roundId || winner !== 0) return;
        winner = data.winner;
        wins = data.wins;
        const loser = winner === 1 ? p2 : p1;
        loser.hp = 0;
        spawnSparks(loser.x, loser.y, loser.color, 22);
        updateHud();
      } else if (data.t === 'req_round' && myId === 1 && winner !== 0) {
        startNextOnlineRound();
      } else if (data.t === 'new_round') {
        roundId = data.rId;
        wins = data.wins;
        initPlayers();
      }
    }

    function startNextOnlineRound() {
      roundId++;
      initPlayers();
      sendReliable({ t: 'new_round', rId: roundId, wins });
    }

    // Conexão inicial ao Broker WebSocket
    function connectWss() {
      if (mqttClient) {
        try { mqttClient.end(true); } catch (_) {}
        mqttClient = null;
      }
      clearTimeout(fallbackTimer);
      wssConnected = false;

      const broker = BROKERS[brokerIdx];
      routeTxt.textContent = `${broker.name} | Sala: ${roomId}`;

      if (isGuest) {
        hostActions.style.display = 'none';
        guestActions.style.display = 'flex';
        nameLabel.textContent = 'Seu Nome (Jogador 2):';
        joinBtn.disabled = true;
        joinBtn.textContent = 'Conectando à sala...';
        statusTxt.textContent = `Conectando à sala ${roomId}...`;
      } else {
        nameLabel.textContent = 'Seu Nome (Jogador 1):';
        copyBtn.disabled = true;
        copyBtn.textContent = 'Conectando...';
        statusTxt.textContent = `Preparando sala ${roomId} em ${broker.name}...`;
      }

      const cid = 'nr3_' + Math.random().toString(36).substring(2, 10);
      mqttClient = mqtt.connect(broker.url, {
        clientId: cid,
        clean: true,
        connectTimeout: 5500,
        reconnectPeriod: 2000
      });

      fallbackTimer = setTimeout(() => {
        if (!mqttClient || !mqttClient.connected) {
          if (!isGuest) {
            brokerIdx = (brokerIdx + 1) % BROKERS.length;
            connectWss();
          } else {
            statusTxt.textContent = `Rota bloqueada na sua rede. Peça para seu amigo clicar em "Trocar Rota" e enviar o novo link.`;
          }
        }
      }, 6000);

      mqttClient.on('connect', () => {
        clearTimeout(fallbackTimer);
        wssConnected = true;

        if (isGuest) {
          mqttClient.subscribe(topicH2C, { qos: 0 });
          statusTxt.textContent = 'Sala localizada! Digite seu nome abaixo e clique em Entrar:';
          joinBtn.disabled = false;
          joinBtn.textContent = 'Entrar na Partida';
          if (!nameInput.value.trim()) nameInput.focus();
        } else {
          mqttClient.subscribe(topicC2H, { qos: 0 });
          inviteUrl = `${window.location.origin}${window.location.pathname}?sala=${roomId}&b=${brokerIdx}&v=3`;
          if (window.location.protocol === 'file:') {
            statusTxt.textContent = 'Arquivo aberto localmente. Publique no GitHub Pages para gerar o link online!';
          } else {
            statusTxt.textContent = 'Digite seu nome e copie o link da sala para enviar ao seu amigo:';
            copyBtn.disabled = false;
            copyBtn.textContent = 'Copiar Link da Sala';
            if (!nameInput.value.trim()) nameInput.focus();
          }
        }
      });

      mqttClient.on('message', (_, payload) => {
        try { handleGamePacket(JSON.parse(payload.toString())); } catch (_) {}
      });
    }

    connectWss();

    // Eventos de interface (Lobby e Nomes)
    nameInput.addEventListener('input', () => {
      const val = nameInput.value.trim();
      safeSet(localStorage, isGuest ? 'nr_name_p2' : 'nr_name_p1', val);
      if (!isGuest) {
        p1.name = cleanName(val, 'Jogador 1');
        updateHud();
      }
    });

    copyBtn.addEventListener('click', () => {
      const typed = nameInput.value.trim();
      if (!typed) {
        statusTxt.textContent = 'Por favor, digite seu nome no campo acima antes de copiar o link!';
        nameInput.focus();
        return;
      }
      p1.name = cleanName(typed, 'Jogador 1');
      safeSet(localStorage, 'nr_name_p1', p1.name);
      updateHud();

      navigator.clipboard.writeText(inviteUrl).then(() => {
        copyBtn.textContent = 'Link Copiado! Aguardando amigo...';
        statusTxt.textContent = `Olá, ${p1.name}! Assim que seu amigo digitar o nome dele e clicar em Entrar, o duelo começa.`;
      });
    });

    joinBtn.addEventListener('click', () => {
      const typed = nameInput.value.trim();
      if (!typed) {
        statusTxt.textContent = 'Digite seu nome acima antes de entrar na partida!';
        nameInput.focus();
        return;
      }
      p2.name = cleanName(typed, 'Jogador 2');
      safeSet(localStorage, 'nr_name_p2', p2.name);
      guestWantsJoin = true;
      joinBtn.disabled = true;
      joinBtn.textContent = 'Entrando na arena...';
      statusTxt.textContent = 'Chamando o anfitrião da sala...';
      sendMqtt({ t: 'join', sid: mySessionSid, name: p2.name });
    });

    switchRouteBtn.addEventListener('click', () => {
      mode = 'MENU';
      brokerIdx = (brokerIdx + 1) % BROKERS.length;
      connectWss();
    });

    localBtn.addEventListener('click', () => {
      if (!localSetupOpen) {
        localSetupOpen = true;
        localP2Group.style.display = 'flex';
        nameLabel.textContent = 'Nome do Jogador 1 (WASD + F):';
        localBtn.textContent = 'Iniciar Duelo Local';
        localBtn.classList.remove('secondary');
        copyBtn.style.display = 'none';
        switchRouteBtn.style.display = 'none';
        statusTxt.textContent = 'Digite os nomes dos dois jogadores para jogar no mesmo teclado:';
        if (!nameInput.value.trim()) nameInput.focus();
        else nameInputP2.focus();
        return;
      }

      const n1 = cleanName(nameInput.value, 'Jogador 1');
      const n2 = cleanName(nameInputP2.value, 'Jogador 2');
      safeSet(localStorage, 'nr_name_p1', n1);
      safeSet(localStorage, 'nr_name_local_p2', n2);

      closeWebRTC();
      if (mqttClient) { try { mqttClient.end(true); } catch (_) {} }
      p1.name = n1;
      p2.name = n2;
      wins = { p1: 0, p2: 0 };
      mode = 'LOCAL';
      nameInput.blur();
      nameInputP2.blur();
      overlay.style.display = 'none';
      initPlayers();
    });

    // Física, Extrapolação Suave e Colisões
    function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
      const testX = Math.max(rx, Math.min(cx, rx + rw));
      const testY = Math.max(ry, Math.min(cy, ry + rh));
      return Math.hypot(cx - testX, cy - testY) < cr;
    }

    function moveWithObstacles(p, moveX, moveY) {
      p.x = Math.max(p.r, Math.min(W - p.r, p.x + moveX));
      for (const o of OBSTACLES) {
        if (rectCircleCollide(o.x, o.y, o.w, o.h, p.x, p.y, p.r)) {
          p.x = moveX > 0 ? o.x - p.r : o.x + o.w + p.r;
        }
      }
      p.y = Math.max(p.r, Math.min(H - p.r, p.y + moveY));
      for (const o of OBSTACLES) {
        if (rectCircleCollide(o.x, o.y, o.w, o.h, p.x, p.y, p.r)) {
          p.y = moveY > 0 ? o.y - p.r : o.y + o.h + p.r;
        }
      }
    }

    function updateLocalPlayer(p, dx, dy, dt) {
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        p.aimX = dx;
        p.aimY = dy;
      }
      p.vx = dx * SPEED;
      p.vy = dy * SPEED;
      moveWithObstacles(p, p.vx * dt, p.vy * dt);

      if (p.fireCd > 0) p.fireCd -= dt;
      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
      if (p.ammo < p.maxAmmo) {
        p.reloadTimer += dt;
        if (p.reloadTimer >= 1.0) {
          p.ammo++;
          p.reloadTimer = 0;
        }
      }
    }

    // Dead Reckoning + Velocidade de Correção Limitada (elimina travadas e corridas bruscas)
    function updateRemotePlayer(p, dt) {
      const age = (performance.now() - p.lastPktTime) / 1000;
      if (age < 0.22) {
        const prevX = p.x, prevY = p.y;
        p.x = p.netX; p.y = p.netY;
        moveWithObstacles(p, p.vx * dt, p.vy * dt);
        p.netX = p.x; p.netY = p.y;

        p.x = prevX; p.y = prevY;
        moveWithObstacles(p, p.vx * dt, p.vy * dt);
      }

      const ex = p.netX - p.x;
      const ey = p.netY - p.y;
      const errDist = Math.hypot(ex, ey);

      if (errDist > 180) {
        p.x = p.netX;
        p.y = p.netY;
      } else if (errDist > 0.5) {
        const maxDriftSpeed = Math.min(errDist * 10, 155);
        const step = Math.min(errDist, maxDriftSpeed * dt);
        moveWithObstacles(p, (ex / errDist) * step, (ey / errDist) * step);
      }

      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
    }

    function shootBullet(p, syncOnline) {
      if (p.ammo <= 0 || p.fireCd > 0) return;
      p.ammo--;
      p.fireCd = 0.16;

      const b = {
        id: `${p.id}_${++bulletSeq}`,
        rId: roundId,
        x: p.x + p.aimX * (p.r + 8),
        y: p.y + p.aimY * (p.r + 8),
        vx: p.aimX * BULLET_SPEED,
        vy: p.aimY * BULLET_SPEED,
        owner: p.id,
        color: p.color,
        bounces: 1,
        r: 5
      };
      bullets.push(b);

      if (syncOnline) {
        sendReliable({
          t: 'fire',
          id: b.id,
          rId: roundId,
          x: Math.round(b.x * 10) / 10,
          y: Math.round(b.y * 10) / 10,
          vx: Math.round(b.vx * 10) / 10,
          vy: Math.round(b.vy * 10) / 10,
          owner: b.owner
        });
      }
    }

    function stepSingleBullet(b, dt) {
      for (let s = 0; s < 2; s++) {
        b.x += b.vx * dt * 0.5;
        if (b.x - b.r <= 0 || b.x + b.r >= W || OBSTACLES.some((o) => rectCircleCollide(o.x, o.y, o.w, o.h, b.x, b.y, b.r))) {
          b.x -= b.vx * dt * 0.5;
          if (b.bounces > 0) { b.vx = -b.vx; b.bounces--; } else return false;
        }
        b.y += b.vy * dt * 0.5;
        if (b.y - b.r <= 0 || b.y + b.r >= H || OBSTACLES.some((o) => rectCircleCollide(o.x, o.y, o.w, o.h, b.x, b.y, b.r))) {
          b.y -= b.vy * dt * 0.5;
          if (b.bounces > 0) { b.vy = -b.vy; b.bounces--; } else return false;
        }
      }
      return true;
    }

    function simulate(dt) {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.life -= dt;
        if (sp.life <= 0) sparks.splice(i, 1);
      }

      if (winner || mode === 'MENU') return;

      if (mode === 'LOCAL') {
        const p1dx = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        const p1dy = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
        const p2dx = (keys['ArrowRight'] ? 1 : 0) - (keys['ArrowLeft'] ? 1 : 0);
        const p2dy = (keys['ArrowDown'] ? 1 : 0) - (keys['ArrowUp'] ? 1 : 0);
        updateLocalPlayer(p1, p1dx, p1dy, dt);
        updateLocalPlayer(p2, p2dx, p2dy, dt);

        const distP = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (distP > 0 && distP < p1.r + p2.r) {
          const push = (p1.r + p2.r - distP) * 0.5;
          const nx = (p2.x - p1.x) / distP;
          const ny = (p2.y - p1.y) / distP;
          moveWithObstacles(p1, -nx * push, -ny * push);
          moveWithObstacles(p2, nx * push, ny * push);
        }
      } else if (mode === 'ONLINE') {
        const me = myId === 1 ? p1 : p2;
        const them = myId === 1 ? p2 : p1;
        const inp = getCombinedInput();
        updateLocalPlayer(me, inp.dx, inp.dy, dt);
        updateRemotePlayer(them, dt);

        const distP = Math.hypot(them.x - me.x, them.y - me.y);
        if (distP > 0 && distP < me.r + them.r) {
          const push = me.r + them.r - distP;
          moveWithObstacles(me, -((them.x - me.x) / distP) * push, -((them.y - me.y) / distP) * push);
        }
      }

      // Atualização de projéteis e checagem justa de impacto
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!stepSingleBullet(b, dt)) {
          spawnSparks(b.x, b.y, b.color, 5);
          bullets.splice(i, 1);
          continue;
        }

        const target = b.owner === 1 ? p2 : p1;
        if (mode === 'LOCAL') {
          if (Math.hypot(b.x - target.x, b.y - target.y) < target.r + b.r) {
            bullets.splice(i, 1);
            if (target.invuln <= 0) {
              target.hp--;
              target.invuln = 0.45;
              spawnSparks(target.x, target.y, target.color, 14);
              if (target.hp <= 0) {
                winner = b.owner;
                if (winner === 1) wins.p1++; else wins.p2++;
              }
              updateHud();
            }
          }
        } else if (mode === 'ONLINE') {
          const me = myId === 1 ? p1 : p2;
          // Cada jogador valida os tiros que atingem a própria nave na sua tela (100% justo)
          if (b.owner !== myId && Math.hypot(b.x - me.x, b.y - me.y) < me.r + b.r) {
            bullets.splice(i, 1);
            if (me.invuln <= 0 && !winner) {
              me.hp = Math.max(0, me.hp - 1);
              me.invuln = 0.45;
              spawnSparks(me.x, me.y, me.color, 14);
              sendReliable({ t: 'hit', rId: roundId, bId: b.id, target: myId, hp: me.hp });

              if (me.hp <= 0) {
                winner = b.owner;
                if (winner === 1) wins.p1++; else wins.p2++;
                sendReliable({ t: 'ko', rId: roundId, winner, wins });
              }
              updateHud();
            }
          }
        }
      }
    }

    function drawPlayer(p) {
      if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2 === 0) return;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.aimX * 24, p.y + p.aimY * 24);
      ctx.stroke();

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#121624';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r - 5, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < p.maxAmmo; i++) {
        ctx.fillStyle = i < p.ammo ? p.color : '#374155';
        ctx.beginPath();
        ctx.arc(p.x - 9 + i * 9, p.y - p.r - 9, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#cbd5f0';
      ctx.font = 'bold 12px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y + p.r + 16);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = '#1a2034';
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      for (const o of OBSTACLES) {
        ctx.fillStyle = '#2d3755';
        ctx.strokeStyle = '#5a73aa';
        ctx.lineWidth = 2;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }

      drawPlayer(p1);
      drawPlayer(p2);

      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const sp of sparks) {
        ctx.globalAlpha = Math.max(0, sp.life / sp.maxLife);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (winner) {
        const winPlayer = winner === 1 ? p1 : p2;
        ctx.fillStyle = 'rgba(10, 12, 20, 0.84)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = winPlayer.color;
        ctx.font = 'bold 32px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${winPlayer.name.toUpperCase()} VENCEU A RODADA!`, W / 2, H / 2 - 28);

        ctx.fillStyle = '#ffd73c';
        ctx.font = 'bold 20px Consolas, monospace';
        ctx.fillText(`Placar Geral: ${p1.name} ${wins.p1} × ${wins.p2} ${p2.name}`, W / 2, H / 2 + 12);

        ctx.fillStyle = '#f0f5ff';
        ctx.font = 'bold 16px Consolas, monospace';
        ctx.fillText('Pressione [ R ] para iniciar a próxima rodada', W / 2, H / 2 + 52);
      }
    }

    // Loops de simulação, sincronização adaptativa e medição de Ping
    let lastTick = performance.now();
    let netSyncAccum = 0;

    function stepFrame() {
      const now = performance.now();
      const dt = Math.min((now - lastTick) / 1000, 0.05);
      if (dt <= 0.001) return;
      lastTick = now;

      simulate(dt);

      if (mode === 'ONLINE') {
        netSyncAccum += dt;
        // 30 pacotes/s no modo direto P2P UDP | ~14 pacotes/s leves no modo WSS (evita fila TCP)
        const interval = p2pReady ? 0.033 : 0.070;
        if (netSyncAccum >= interval) {
          netSyncAccum = 0;
          const me = myId === 1 ? p1 : p2;
          sendFast({
            t: 'm',
            s: ++moveSeq,
            r: roundId,
            x: Math.round(me.x * 10) / 10,
            y: Math.round(me.y * 10) / 10,
            vx: Math.round(me.vx),
            vy: Math.round(me.vy),
            ax: Math.round(me.aimX * 100) / 100,
            ay: Math.round(me.aimY * 100) / 100,
            am: me.ammo,
            inv: Math.round(me.invuln * 100) / 100
          });
        }
      }
    }

    // Mantém a física rodando mesmo se alguém clicar fora da aba
    setInterval(() => {
      if (document.hidden) stepFrame();
    }, 40);

    // Medidor de Ping em tempo real + Sonda de upgrade P2P + Rechamada de entrada
    setInterval(() => {
      if (isGuest && guestWantsJoin && mode !== 'ONLINE' && wssConnected) {
        sendMqtt({ t: 'join', sid: mySessionSid, name: p2.name });
      }

      if (mode === 'ONLINE') {
        if (!p2pReady && fastDC && fastDC.readyState === 'open' && relDC && relDC.readyState === 'open') {
          try { fastDC.send(JSON.stringify({ t: 'p2p_probe', ts: performance.now() })); } catch (_) {}
        }
        if (p2pReady && performance.now() - lastFastRecv > 2600) {
          p2pReady = false;
          updateHud();
        }
        sendFast({ t: 'ping', ts: performance.now() });
      }
    }, 800);

    function loop() {
      stepFrame();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
