<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Neon Ricochet 1v1 - Online v4</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0c0e18;
      color: #f0f5ff;
      font-family: Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    #hud {
      width: 860px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }
    .p1-txt { color: #00dcff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p2-txt { color: #ff4664; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .center-hud {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #151a2e;
      border: 1px solid #364670;
      padding: 6px 14px;
      border-radius: 99px;
    }
    #scoreBoard { font-size: 15px; color: #ffffff; letter-spacing: 0.5px; }
    .divider { color: #4a5a85; }
    #pingBadge {
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #1f2742;
      color: #8fa4d4;
    }
    .ping-good { color: #50fa7b !important; }
    .ping-mid  { color: #ffd73c !important; }
    .ping-bad  { color: #ff6b6b !important; }

    #wrapper { position: relative; width: 860px; height: 540px; }
    canvas {
      background: #121624;
      border: 3px solid #5a73aa;
      border-radius: 8px;
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 24, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      border-radius: 8px;
    }
    h1 { font-size: 28px; letter-spacing: 1px; color: #00dcff; }
    p { font-size: 13px; color: #b8c4e0; max-width: 610px; line-height: 1.5; }
    .status { color: #ffd73c; font-weight: bold; font-size: 15px; max-width: 650px; min-height: 22px; }
    .route-badge {
      font-size: 12px;
      color: #8fa4d4;
      background: #1a2138;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid #364670;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin: 4px 0;
    }
    .input-group label { font-size: 13px; color: #9fb0d9; text-align: left; }
    input[type="text"] {
      user-select: text;
      background: #171d33;
      border: 2px solid #45598a;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      outline: none;
    }
    input[type="text"]:focus { border-color: #00dcff; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    button {
      background: #00dcff;
      color: #0c0e18;
      border: none;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.92; transform: translateY(-1px); }
    button:disabled { background: #3a4562; color: #8892b0; cursor: not-allowed; transform: none; }
    button.secondary { background: #2d3755; color: #f0f5ff; border: 1px solid #5a73aa; }
  </style>
</head>
<body>

  <div id="hud">
    <span class="p1-txt" id="hudP1">JOGADOR 1: 5 HP</span>
    <div class="center-hud">
      <span id="scoreBoard">JOGADOR 1 0 &times; 0 JOGADOR 2</span>
      <span class="divider">|</span>
      <span id="pingBadge">Ping: -- ms</span>
    </div>
    <span class="p2-txt" id="hudP2">JOGADOR 2: 5 HP</span>
  </div>

  <div id="wrapper">
    <canvas id="game" width="860" height="540"></canvas>

    <div id="overlay">
      <h1>NEON RICOCHET 1v1 <span style="font-size:16px;color:#50fa7b;">v4</span></h1>
      <div class="route-badge" id="routeTxt">Testando rotas para menor latência...</div>
      <div class="status" id="statusTxt">Buscando o servidor mais rápido...</div>

      <div class="input-group">
        <label id="nameLabel" for="nameInput">Seu Nome:</label>
        <input type="text" id="nameInput" maxlength="14" placeholder="Digite seu nome..." autocomplete="off" />
      </div>

      <div class="input-group" id="localP2Group" style="display:none;">
        <label for="nameInputP2">Nome do Jogador 2 (Setas):</label>
        <input type="text" id="nameInputP2" maxlength="14" placeholder="Nome do Jogador 2..." autocomplete="off" />
      </div>

      <div class="btn-row" id="hostActions">
        <button id="copyBtn" disabled>Medindo rotas...</button>
        <button id="switchRouteBtn" class="secondary">Trocar Rota</button>
        <button id="localBtn" class="secondary">Mesmo PC</button>
      </div>

      <div class="btn-row" id="guestActions" style="display:none;">
        <button id="joinBtn" disabled>Conectando à sala...</button>
      </div>

      <p>
        Controles Online: <b>WASD</b> ou <b>Setas</b> para mover &bull; <b>F</b>, <b>Numpad 1</b> ou <b>Shift Direito</b> para atirar.
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const statusTxt = document.getElementById('statusTxt');
    const routeTxt = document.getElementById('routeTxt');
    const nameInput = document.getElementById('nameInput');
    const nameLabel = document.getElementById('nameLabel');
    const localP2Group = document.getElementById('localP2Group');
    const nameInputP2 = document.getElementById('nameInputP2');
    const copyBtn = document.getElementById('copyBtn');
    const switchRouteBtn = document.getElementById('switchRouteBtn');
    const localBtn = document.getElementById('localBtn');
    const hostActions = document.getElementById('hostActions');
    const guestActions = document.getElementById('guestActions');
    const joinBtn = document.getElementById('joinBtn');
    const hudP1 = document.getElementById('hudP1');
    const hudP2 = document.getElementById('hudP2');
    const scoreBoard = document.getElementById('scoreBoard');
    const pingBadge = document.getElementById('pingBadge');

    const W = canvas.width;
    const H = canvas.height;
    const SPEED = 265;
    const BULLET_SPEED = 520;

    const OBSTACLES = [
      { x: 190, y: 110, w: 44, h: 105 },
      { x: 190, y: 325, w: 44, h: 105 },
      { x: 626, y: 110, w: 44, h: 105 },
      { x: 626, y: 325, w: 44, h: 105 },
      { x: 408, y: 215, w: 44, h: 110 }
    ];

    const BROKERS = [
      { name: 'EMQX Fast', url: 'wss://broker.emqx.io:8084/mqtt' },
      { name: 'HiveMQ Cloud', url: 'wss://broker.hivemq.com:8884/mqtt' },
      { name: 'Eclipse 443 (Anti-Firewall)', url: 'wss://mqtt.eclipseprojects.io:443/mqtt' }
    ];

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function safeGet(store, k, def = '') {
      try { return store.getItem(k) || def; } catch (_) { return def; }
    }
    function safeSet(store, k, v) {
      try { store.setItem(k, v); } catch (_) {}
    }

    const params = new URLSearchParams(window.location.search);
    const guestRoomParam = params.get('sala');
    const isGuest = Boolean(guestRoomParam);
    const myId = isGuest ? 2 : 1;
    let brokerIdx = Math.min(BROKERS.length - 1, Math.max(0, parseInt(params.get('b') || '0', 10) || 0));

    let roomId = guestRoomParam || safeGet(sessionStorage, 'nr_room_v4');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
      safeSet(sessionStorage, 'nr_room_v4', roomId);
    }

    const topicC2H = `neonricochet_v4/${roomId}/c2h`;
    const topicH2C = `neonricochet_v4/${roomId}/h2c`;
    const mySessionSid = Math.random().toString(36).substring(2, 9);
    let activeGuestSid = '';

    nameInput.value = safeGet(localStorage, isGuest ? 'nr_name_p2' : 'nr_name_p1', '');
    nameInputP2.value = safeGet(localStorage, 'nr_name_local_p2', '');

    let mode = 'MENU'; // MENU, ONLINE, LOCAL
    let wssConnected = false;
    let guestWantsJoin = false;
    let localSetupOpen = false;
    let inviteUrl = '';

    // Estado de rede e P2P
    let mqttClient = null;
    let fallbackTimer = null;
    let pc = null;
    let fastDC = null;
    let relDC = null;
    let p2pReady = false;
    let p2pAttempts = 0;
    let lastP2PAttemptTime = 0;
    let lastFastRecv = 0;
    let pingMs = null;

    // Deduplicação de eventos críticos
    let evSeq = 0;
    const seenEvents = new Set();

    // Estado da partida
    let roundId = 1;
    let moveSeq = 0;
    let bulletSeq = 0;
    let wins = { p1: 0, p2: 0 };
    let winner = 0;
    let damageFlash = 0;
    let p1, p2, bullets = [], sparks = [], popups = [];

    function cleanName(raw, fallback) {
      const trimmed = (raw || '').trim().slice(0, 14);
      return trimmed || fallback;
    }

    function makePlayer(id, x, y, aimX, color, name) {
      return {
        id, name, x, y, netX: x, netY: y, vx: 0, vy: 0,
        r: 16, aimX, aimY: 0, color,
        hp: 5, ammo: 3, maxAmmo: 3, reloadTimer: 0,
        fireCd: 0, invuln: 0,
        lastSeq: 0, lastPktTime: performance.now()
      };
    }

    function initPlayers() {
      const n1 = p1 ? p1.name : cleanName(nameInput.value, 'Jogador 1');
      const n2 = p2 ? p2.name : 'Jogador 2';
      p1 = makePlayer(1, 90, H / 2, 1, '#00dcff', n1);
      p2 = makePlayer(2, W - 90, H / 2, -1, '#ff4664', n2);
      bullets = [];
      sparks = [];
      popups = [];
      winner = 0;
      damageFlash = 0;
      moveSeq = 0;
      updateHud();
    }
    initPlayers();

    function spawnSparks(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 70 + Math.random() * 190;
        sparks.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color,
          life: 0.28,
          maxLife: 0.28
        });
      }
    }

    function spawnPopup(x, y, text, color) {
      popups.push({ x, y: y - 22, text, color, life: 0.55, maxLife: 0.55 });
    }

    function recordPing(sample, isDirectP2P) {
      const val = Math.max(1, Math.round(sample));
      if (pingMs === null || (isDirectP2P && pingMs > 80)) {
        pingMs = val;
      } else {
        pingMs = Math.round(pingMs * 0.65 + val * 0.35);
      }
      updateHud();
    }

    function updateHud() {
      hudP1.textContent = `${p1.name}: ${p1.hp} HP`;
      hudP2.textContent = `${p2.name}: ${p2.hp} HP`;
      scoreBoard.textContent = `${p1.name} ${wins.p1} × ${wins.p2} ${p2.name}`;

      pingBadge.classList.remove('ping-good', 'ping-mid', 'ping-bad');
      if (mode === 'LOCAL') {
        pingBadge.textContent = 'Local (0 ms)';
        pingBadge.classList.add('ping-good');
      } else if (pingMs === null) {
        pingBadge.textContent = 'Ping: -- ms';
      } else {
        const tag = p2pReady ? '⚡ P2P' : '🌐 WSS';
        pingBadge.textContent = `${tag}: ${pingMs} ms`;
        if (pingMs < 60) pingBadge.classList.add('ping-good');
        else if (pingMs <= 160) pingBadge.classList.add('ping-mid');
        else pingBadge.classList.add('ping-bad');
      }
    }

    // Controle de Teclado
    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        if (e.code === 'Enter') {
          if (isGuest && !joinBtn.disabled) joinBtn.click();
          else if (!isGuest && localSetupOpen) localBtn.click();
          else if (!isGuest && !copyBtn.disabled) copyBtn.click();
        }
        return;
      }

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;
      if (e.repeat) return;

      const isP1Act = e.code === 'KeyF';
      const isP2Act = e.code === 'Numpad1' || e.code === 'ShiftRight';
      const isAnyAct = isP1Act || isP2Act;

      if (mode === 'LOCAL') {
        if (isP1Act && !winner) shootBullet(p1, false);
        if (isP2Act && !winner) shootBullet(p2, false);
        if (e.code === 'KeyR' && winner) {
          roundId++;
          initPlayers();
        }
      } else if (mode === 'ONLINE') {
        const me = myId === 1 ? p1 : p2;
        if (isAnyAct && !winner) shootBullet(me, true);
        if (e.code === 'KeyR' && winner) {
          if (myId === 1) startNextOnlineRound();
          else sendCritical({ t: 'req_round' });
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function getCombinedInput() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      return { dx, dy };
    }

    // Camada de Rede Híbrida (P2P em Pacote Único + WSS Otimizado)
    function sendMqtt(payload) {
      if (mqttClient && mqttClient.connected) {
        const outTopic = isGuest ? topicC2H : topicH2C;
        mqttClient.publish(outTopic, JSON.stringify(payload), { qos: 0 });
      }
    }

    function sendFast(payload) {
      if (p2pReady && fastDC && fastDC.readyState === 'open') {
        try { fastDC.send(JSON.stringify(payload)); return; } catch (_) {}
      }
      sendMqtt(payload);
    }

    // Envia eventos críticos (tiro, dano, fim de round) com deduplicação e zero fila
    function sendCritical(obj) {
      obj.eid = `${myId}_${++evSeq}_${roomId}`;
      const raw = JSON.stringify(obj);
      if (p2pReady) {
        let sent = false;
        if (fastDC && fastDC.readyState === 'open') {
          try { fastDC.send(raw); sent = true; } catch (_) {}
        }
        if (relDC && relDC.readyState === 'open') {
          try { relDC.send(raw); sent = true; } catch (_) {}
        }
        if (sent) return;
      }
      sendMqtt(obj);
    }

    function closeWebRTC() {
      p2pReady = false;
      if (fastDC) { try { fastDC.close(); } catch (_) {} fastDC = null; }
      if (relDC) { try { relDC.close(); } catch (_) {} relDC = null; }
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    }

    function waitIceGathering(peerConn, timeoutMs = 1150) {
      return new Promise((resolve) => {
        if (peerConn.iceGatheringState === 'complete') {
          resolve();
          return;
        }
        let finished = false;
        const done = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          peerConn.removeEventListener('icegatheringstatechange', check);
          resolve();
        };
        const check = () => {
          if (peerConn.iceGatheringState === 'complete') done();
        };
        peerConn.addEventListener('icegatheringstatechange', check);
        const timer = setTimeout(done, timeoutMs);
      });
    }

    function bindFastChannel(ch) {
      fastDC = ch;
      ch.onopen = () => {
        try { ch.send(JSON.stringify({ t: 'p2p_probe', ts: performance.now() })); } catch (_) {}
      };
      ch.onmessage = (ev) => {
        lastFastRecv = performance.now();
        let data;
        try { data = JSON.parse(ev.data); } catch (_) { return; }
        if (data && !Array.isArray(data)) {
          if (data.t === 'p2p_probe') {
            p2pReady = true;
            try { ch.send(JSON.stringify({ t: 'p2p_ack', ts: data.ts })); } catch (_) {}
            return;
          }
          if (data.t === 'p2p_ack') {
            const wasP2P = p2pReady;
            p2pReady = true;
            recordPing(performance.now() - data.ts, !wasP2P);
            return;
          }
        }
        handleIncoming(data);
      };
      ch.onclose = () => { p2pReady = false; updateHud(); };
    }

    function bindRelChannel(ch) {
      relDC = ch;
      ch.onmessage = (ev) => {
        lastFastRecv = performance.now();
        try { handleIncoming(JSON.parse(ev.data)); } catch (_) {}
      };
    }

    async function initiateHostP2P() {
      if (isGuest || !activeGuestSid) return;
      closeWebRTC();
      lastP2PAttemptTime = performance.now();
      p2pAttempts++;

      try {
        const peerConn = new RTCPeerConnection(ICE_CONFIG);
        pc = peerConn;
        bindFastChannel(peerConn.createDataChannel('fast', { ordered: false, maxRetransmits: 0 }));
        bindRelChannel(peerConn.createDataChannel('rel', { ordered: true }));

        const offer = await peerConn.createOffer();
        await peerConn.setLocalDescription(offer);
        await waitIceGathering(peerConn, 1150);

        if (pc === peerConn && peerConn.localDescription) {
          sendMqtt({ t: 'rtc_offer_full', sid: activeGuestSid, sdp: peerConn.localDescription });
        }
      } catch (_) {}
    }

    async function answerGuestP2P(sdpOffer) {
      if (!isGuest) return;
      closeWebRTC();
      try {
        const peerConn = new RTCPeerConnection(ICE_CONFIG);
        pc = peerConn;
        peerConn.ondatachannel = (ev) => {
          if (ev.channel.label === 'fast') bindFastChannel(ev.channel);
          if (ev.channel.label === 'rel') bindRelChannel(ev.channel);
        };

        await peerConn.setRemoteDescription(new RTCSessionDescription(sdpOffer));
        const answer = await peerConn.createAnswer();
        await peerConn.setLocalDescription(answer);
        await waitIceGathering(peerConn, 1150);

        if (pc === peerConn && peerConn.localDescription) {
          sendMqtt({ t: 'rtc_ans_full', sid: mySessionSid, sdp: peerConn.localDescription });
        }
      } catch (_) {}
    }

    function handleSignaling(data) {
      if (!isGuest) {
        if (data.t === 'join') {
          const isNewSession = data.sid !== activeGuestSid;
          activeGuestSid = data.sid;
          p1.name = cleanName(nameInput.value, 'Jogador 1');
          p2.name = cleanName(data.name, 'Jogador 2');

          if (mode !== 'ONLINE' || isNewSession) {
            mode = 'ONLINE';
            p2pAttempts = 0;
            nameInput.blur();
            overlay.style.display = 'none';
            document.title = `🟢 ${p1.name} vs ${p2.name}`;
            roundId++;
            initPlayers();
            initiateHostP2P();
          }

          sendMqtt({
            t: 'welcome',
            sid: activeGuestSid,
            hostName: p1.name,
            guestName: p2.name,
            wins,
            rId: roundId
          });
          return true;
        }
        if (data.t === 'rtc_ans_full' && data.sid === activeGuestSid && pc) {
          pc.setRemoteDescription(new RTCSessionDescription(data.sdp)).catch(() => {});
          return true;
        }
      } else {
        if (data.t === 'welcome' && data.sid === mySessionSid) {
          p1.name = cleanName(data.hostName, 'Jogador 1');
          p2.name = cleanName(data.guestName, cleanName(nameInput.value, 'Jogador 2'));
          wins = data.wins || wins;
          if (mode !== 'ONLINE' || roundId !== data.rId) {
            roundId = data.rId;
            mode = 'ONLINE';
            guestWantsJoin = false;
            nameInput.blur();
            overlay.style.display = 'none';
            document.title = `🟢 ${p1.name} vs ${p2.name}`;
            initPlayers();
          }
          updateHud();
          return true;
        }
        if (data.t === 'rtc_offer_full' && data.sid === mySessionSid) {
          answerGuestP2P(data.sdp);
          return true;
        }
      }
      return false;
    }

    function handleIncoming(data) {
      if (!data) return;

      // Pacote enxuto de movimento em array: ["m", seq, rId, x, y, vx, vy, ax, ay, ammo]
      if (Array.isArray(data)) {
        if (data[0] === 'm' && mode === 'ONLINE') {
          const [, seq, rId, x, y, vx, vy, ax, ay, am] = data;
          const them = myId === 1 ? p2 : p1;
          if (rId !== roundId || seq <= them.lastSeq) return;
          them.lastSeq = seq;
          them.lastPktTime = performance.now();
          them.netX = x;
          them.netY = y;
          them.vx = vx;
          them.vy = vy;
          them.aimX = ax;
          them.aimY = ay;
          them.ammo = am;
        }
        return;
      }

      if (data.eid) {
        if (seenEvents.has(data.eid)) return;
        seenEvents.add(data.eid);
        if (seenEvents.size > 400) {
          const first = seenEvents.values().next().value;
          seenEvents.delete(first);
        }
      }

      if (handleSignaling(data)) return;

      if (data.t === 'ping') {
        sendFast({ t: 'pong', ts: data.ts });
        return;
      }
      if (data.t === 'pong') {
        recordPing(performance.now() - data.ts, false);
        return;
      }

      if (mode !== 'ONLINE') return;

      if (data.t === 'fire') {
        if (data.rId !== roundId || bullets.some((b) => b.id === data.id)) return;
        const nb = {
          id: data.id,
          rId: data.rId,
          x: data.x,
          y: data.y,
          vx: data.vx,
          vy: data.vy,
          owner: data.owner,
          color: data.owner === 1 ? '#00dcff' : '#ff4664',
          bounces: 1,
          r: 5
        };

        // Avança a bala em micro-passos pelo tempo real de trânsito (respeitando paredes)
        const transitSec = Math.min(0.26, ((pingMs || 100) / 2) / 1000);
        let rem = transitSec;
        let alive = true;
        while (rem > 0.002 && alive) {
          const step = Math.min(0.008, rem);
          alive = stepSingleBullet(nb, step);
          rem -= step;
        }
        if (alive) bullets.push(nb);
        else spawnSparks(nb.x, nb.y, nb.color, 5);
      } else if (data.t === 'hit') {
        if (data.rId !== roundId) return;
        const idx = bullets.findIndex((b) => b.id === data.bId);
        if (idx !== -1) bullets.splice(idx, 1);

        const victim = data.target === 1 ? p1 : p2;
        victim.hp = data.hp;
        victim.invuln = 0.45;
        if (victim.id === myId) damageFlash = 0.22;
        spawnSparks(victim.x, victim.y, victim.color, 16);
        spawnPopup(victim.x, victim.y, '-1 HP', '#ff6b6b');

        // Se o anfitrião sofreu o golpe final, confirma e sincroniza o placar oficial
        if (myId === 1 && victim.id === 1 && victim.hp <= 0 && winner === 0) {
          winner = 2;
          wins.p2++;
          sendCritical({ t: 'ko', rId: roundId, winner: 2, wins });
        }
        updateHud();
      } else if (data.t === 'ko') {
        if (data.rId !== roundId) return;
        winner = data.winner;
        wins = data.wins;
        if (winner === 1) {
          p2.hp = 0;
          if (p1.hp <= 0) p1.hp = 1;
        } else {
          p1.hp = 0;
          if (p2.hp <= 0) p2.hp = 1;
        }
        const loser = winner === 1 ? p2 : p1;
        spawnSparks(loser.x, loser.y, loser.color, 24);
        updateHud();
      } else if (data.t === 'req_round' && myId === 1 && winner !== 0) {
        startNextOnlineRound();
      } else if (data.t === 'new_round') {
        roundId = data.rId;
        wins = data.wins;
        initPlayers();
      }
    }

    function startNextOnlineRound() {
      roundId++;
      initPlayers();
      sendCritical({ t: 'new_round', rId: roundId, wins });
    }

    // Benchmark Automático das Rotas WebSocket para o Host escolher sempre a menor latência
    function benchmarkBrokers() {
      return new Promise((resolve) => {
        let settled = false;
        let finishedCount = 0;
        let best = { idx: 2, rtt: Infinity }; // Fallback seguro na porta 443
        const probes = [];

        const finish = () => {
          if (settled) return;
          settled = true;
          for (const pr of probes) {
            try { pr.end(true); } catch (_) {}
          }
          resolve(best.idx);
        };

        const timer = setTimeout(finish, 2100);

        BROKERS.forEach((b, idx) => {
          const testTopic = `nr_probe_${Math.random().toString(36).substring(2, 10)}`;
          let t0 = 0;
          const pr = mqtt.connect(b.url, {
            clientId: 'prb_' + Math.random().toString(36).substring(2, 9),
            clean: true,
            connectTimeout: 1900,
            reconnectPeriod: 0
          });
          probes.push(pr);

          pr.on('connect', () => {
            pr.subscribe(testTopic, { qos: 0 }, () => {
              t0 = performance.now();
              pr.publish(testTopic, '1', { qos: 0 });
            });
          });

          pr.on('message', () => {
            const rtt = performance.now() - t0;
            if (rtt < best.rtt) best = { idx, rtt };
            try { pr.end(true); } catch (_) {}
            finishedCount++;
            if (finishedCount === BROKERS.length) {
              clearTimeout(timer);
              finish();
            }
          });

          pr.on('error', () => {
            try { pr.end(true); } catch (_) {}
            finishedCount++;
            if (finishedCount === BROKERS.length) {
              clearTimeout(timer);
              finish();
            }
          });
        });
      });
    }

    function connectWss() {

    // Física, Extrapolação e Registro Instantâneo de Tiros
    function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
      const testX = Math.max(rx, Math.min(cx, rx + rw));
      const testY = Math.max(ry, Math.min(cy, ry + rh));
      return Math.hypot(cx - testX, cy - testY) < cr;
    }

    function moveWithObstacles(p, moveX, moveY) {
      p.x = Math.max(p.r, Math.min(W - p.r, p.x + moveX));
      for (const o of OBSTACLES) {
        if (rectCircleCollide(o.x, o.y, o.w, o.h, p.x, p.y, p.r)) {
          p.x = moveX > 0 ? o.x - p.r : o.x + o.w + p.r;
        }
      }
      p.y = Math.max(p.r, Math.min(H - p.r, p.y + moveY));
      for (const o of OBSTACLES) {
        if (rectCircleCollide(o.x, o.y, o.w, o.h, p.x, p.y, p.r)) {
          p.y = moveY > 0 ? o.y - p.r : o.y + o.h + p.r;
        }
      }
    }

    function updateLocalPlayer(p, dx, dy, dt) {
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        p.aimX = dx;
        p.aimY = dy;
      }
      p.vx = dx * SPEED;
      p.vy = dy * SPEED;
      moveWithObstacles(p, p.vx * dt, p.vy * dt);

      if (p.fireCd > 0) p.fireCd -= dt;
      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
      if (p.ammo < p.maxAmmo) {
        p.reloadTimer += dt;
        if (p.reloadTimer >= 1.0) {
          p.ammo++;
          p.reloadTimer = 0;
        }
      }
    }

    function updateRemotePlayer(p, dt) {
      const age = (performance.now() - p.lastPktTime) / 1000;
      if (age < 0.24) {
        const prevX = p.x, prevY = p.y;
        p.x = p.netX; p.y = p.netY;
        moveWithObstacles(p, p.vx * dt, p.vy * dt);
        p.netX = p.x; p.netY = p.y;

        p.x = prevX; p.y = prevY;
        moveWithObstacles(p, p.vx * dt, p.vy * dt);
      }

      const ex = p.netX - p.x;
      const ey = p.netY - p.y;
      const errDist = Math.hypot(ex, ey);

      if (errDist > 180) {
        p.x = p.netX;
        p.y = p.netY;
      } else if (errDist > 0.4) {
        const maxDriftSpeed = Math.min(errDist * 11, 165);
        const step = Math.min(errDist, maxDriftSpeed * dt);
        moveWithObstacles(p, (ex / errDist) * step, (ey / errDist) * step);
      }

      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
    }

    function shootBullet(p, syncOnline) {
      if (p.ammo <= 0 || p.fireCd > 0) return;
      p.ammo--;
      p.fireCd = 0.16;

      const b = {
        id: `${p.id}_${++bulletSeq}`,
        rId: roundId,
        x: p.x + p.aimX * (p.r + 8),
        y: p.y + p.aimY * (p.r + 8),
        vx: p.aimX * BULLET_SPEED,
        vy: p.aimY * BULLET_SPEED,
        owner: p.id,
        color: p.color,
        bounces: 1,
        r: 5
      };
      bullets.push(b);

      if (syncOnline) {
        sendCritical({
          t: 'fire',
          id: b.id,
          rId: roundId,
          x: Math.round(b.x * 10) / 10,
          y: Math.round(b.y * 10) / 10,
          vx: Math.round(b.vx * 10) / 10,
          vy: Math.round(b.vy * 10) / 10,
          owner: b.owner
        });
      }
    }

    function stepSingleBullet(b, dt) {
      for (let s = 0; s < 2; s++) {
        b.x += b.vx * dt * 0.5;
        if (b.x - b.r <= 0 || b.x + b.r >= W || OBSTACLES.some((o) => rectCircleCollide(o.x, o.y, o.w, o.h, b.x, b.y, b.r))) {
          b.x -= b.vx * dt * 0.5;
          if (b.bounces > 0) { b.vx = -b.vx; b.bounces--; } else return false;
        }
        b.y += b.vy * dt * 0.5;
        if (b.y - b.r <= 0 || b.y + b.r >= H || OBSTACLES.some((o) => rectCircleCollide(o.x, o.y, o.w, o.h, b.x, b.y, b.r))) {
          b.y -= b.vy * dt * 0.5;
          if (b.bounces > 0) { b.vy = -b.vy; b.bounces--; } else return false;
        }
      }
      return true;
    }

    function simulate(dt) {
      if (damageFlash > 0) damageFlash = Math.max(0, damageFlash - dt);

      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.life -= dt;
        if (sp.life <= 0) sparks.splice(i, 1);
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const pp = popups[i];
        pp.y -= 38 * dt;
        pp.life -= dt;
        if (pp.life <= 0) popups.splice(i, 1);
      }

      if (winner || mode === 'MENU') return;

      if (mode === 'LOCAL') {
        const p1dx = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        const p1dy = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
        const p2dx = (keys['ArrowRight'] ? 1 : 0) - (keys['ArrowLeft'] ? 1 : 0);
        const p2dy = (keys['ArrowDown'] ? 1 : 0) - (keys['ArrowUp'] ? 1 : 0);
        updateLocalPlayer(p1, p1dx, p1dy, dt);
        updateLocalPlayer(p2, p2dx, p2dy, dt);

        const distP = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (distP > 0 && distP < p1.r + p2.r) {
          const push = (p1.r + p2.r - distP) * 0.5;
          const nx = (p2.x - p1.x) / distP;
          const ny = (p2.y - p1.y) / distP;
          moveWithObstacles(p1, -nx * push, -ny * push);
          moveWithObstacles(p2, nx * push, ny * push);
        }
      } else if (mode === 'ONLINE') {
        const me = myId === 1 ? p1 : p2;
        const them = myId === 1 ? p2 : p1;
        const inp = getCombinedInput();
        updateLocalPlayer(me, inp.dx, inp.dy, dt);
        updateRemotePlayer(them, dt);

        const distP = Math.hypot(them.x - me.x, them.y - me.y);
        if (distP > 0 && distP < me.r + them.r) {
          const push = me.r + them.r - distP;
          moveWithObstacles(me, -((them.x - me.x) / distP) * push, -((them.y - me.y) / distP) * push);
        }
      }

      // Colisão de projéteis com Registro Instantâneo no Atacante (0 ms de atraso visual)
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!stepSingleBullet(b, dt)) {
          spawnSparks(b.x, b.y, b.color, 5);
          bullets.splice(i, 1);
          continue;
        }

        const target = b.owner === 1 ? p2 : p1;

        if (mode === 'LOCAL') {
          if (Math.hypot(b.x - target.x, b.y - target.y) < target.r + b.r) {
            bullets.splice(i, 1);
            if (target.invuln <= 0) {
              target.hp--;
              target.invuln = 0.45;
              spawnSparks(target.x, target.y, target.color, 15);
              spawnPopup(target.x, target.y, '-1 HP', '#50fa7b');
              if (target.hp <= 0) {
                winner = b.owner;
                if (winner === 1) wins.p1++; else wins.p2++;
              }
              updateHud();
            }
          }
        } else if (mode === 'ONLINE') {
          const me = myId === 1 ? p1 : p2;
          const them = myId === 1 ? p2 : p1;

          if (b.owner === myId) {
            // SEUS tiros validam contra o inimigo imediatamente na sua tela!
            if (Math.hypot(b.x - them.x, b.y - them.y) < them.r + b.r) {
              bullets.splice(i, 1);
              if (them.invuln <= 0 && !winner) {
                them.hp = Math.max(0, them.hp - 1);
                them.invuln = 0.45;
                spawnSparks(them.x, them.y, '#ffffff', 16);
                spawnPopup(them.x, them.y, 'HIT! -1', '#50fa7b');
                sendCritical({ t: 'hit', rId: roundId, bId: b.id, target: them.id, hp: them.hp });

                if (them.hp <= 0) {
                  winner = myId;
                  if (myId === 1) {
                    wins.p1++;
                    sendCritical({ t: 'ko', rId: roundId, winner: 1, wins });
                  } else {
                    wins.p2++;
                  }
                }
                updateHud();
              } else {
                spawnSparks(b.x, b.y, b.color, 6);
              }
            }
          } else {
            // Tiros inimigos somem ao encostar visualmente em você (o HP desconta pelo evento exato do atacante)
            if (Math.hypot(b.x - me.x, b.y - me.y) < me.r + b.r) {
              bullets.splice(i, 1);
              spawnSparks(b.x, b.y, b.color, 6);
            }
          }
        }
      }
    }

    function drawPlayer(p) {
      if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2 === 0) return;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.aimX * 24, p.y + p.aimY * 24);
      ctx.stroke();

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#121624';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r - 5, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < p.maxAmmo; i++) {
        ctx.fillStyle = i < p.ammo ? p.color : '#374155';
        ctx.beginPath();
        ctx.arc(p.x - 9 + i * 9, p.y - p.r - 9, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#cbd5f0';
      ctx.font = 'bold 12px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y + p.r + 16);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = '#1a2034';
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      for (const o of OBSTACLES) {
        ctx.fillStyle = '#2d3755';
        ctx.strokeStyle = '#5a73aa';
        ctx.lineWidth = 2;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }

      drawPlayer(p1);
      drawPlayer(p2);

      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const sp of sparks) {
        ctx.globalAlpha = Math.max(0, sp.life / sp.maxLife);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const pp of popups) {
        ctx.globalAlpha = Math.max(0, pp.life / pp.maxLife);
        ctx.fillStyle = pp.color;
        ctx.font = 'bold 14px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(pp.text, pp.x, pp.y);
      }
      ctx.globalAlpha = 1;

      if (damageFlash > 0) {
        ctx.strokeStyle = `rgba(255, 70, 100, ${damageFlash * 2.5})`;
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, W, H);
      }

      if (winner) {
        const winPlayer = winner === 1 ? p1 : p2;
        ctx.fillStyle = 'rgba(10, 12, 20, 0.84)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = winPlayer.color;
        ctx.font = 'bold 32px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${winPlayer.name.toUpperCase()} VENCEU A RODADA!`, W / 2, H / 2 - 28);

        ctx.fillStyle = '#ffd73c';
        ctx.font = 'bold 20px Consolas, monospace';
        ctx.fillText(`Placar Geral: ${p1.name} ${wins.p1} × ${wins.p2} ${p2.name}`, W / 2, H / 2 + 12);

        ctx.fillStyle = '#f0f5ff';
        ctx.font = 'bold 16px Consolas, monospace';
        ctx.fillText('Pressione [ R ] para iniciar a próxima rodada', W / 2, H / 2 + 52);
      }
    }

    // Loops de Física e Sincronização de Alta Frequência
    let lastTick = performance.now();
    let netSyncAccum = 0;

    function stepFrame() {
      const now = performance.now();
      const dt = Math.min((now - lastTick) / 1000, 0.05);
      if (dt <= 0.001) return;
      lastTick = now;

      simulate(dt);

      if (mode === 'ONLINE') {
        netSyncAccum += dt;
        // 45 pacotes/s em P2P direto | 22 pacotes/s ultracompactos em WSS
        const interval = p2pReady ? 0.022 : 0.045;
        if (netSyncAccum >= interval) {
          netSyncAccum = 0;
          const me = myId === 1 ? p1 : p2;
          sendFast([
            'm',
            ++moveSeq,
            roundId,
            Math.round(me.x * 10) / 10,
            Math.round(me.y * 10) / 10,
            Math.round(me.vx),
            Math.round(me.vy),
            Math.round(me.aimX * 100) / 100,
            Math.round(me.aimY * 100) / 100,
            me.ammo
          ]);
        }
      }
    }

    setInterval(() => {
      if (document.hidden) stepFrame();
    }, 35);

    // Sonda contínua de Ping e Reconexão Automática P2P
    setInterval(() => {
      if (isGuest && guestWantsJoin && mode !== 'ONLINE' && wssConnected) {
        sendMqtt({ t: 'join', sid: mySessionSid, name: p2.name });
      }

      if (mode === 'ONLINE') {
        const now = performance.now();

        if (!p2pReady && fastDC && fastDC.readyState === 'open') {
          try { fastDC.send(JSON.stringify({ t: 'p2p_probe', ts: now })); } catch (_) {}
        }

        // Retenta abrir o túnel P2P direto automaticamente se ainda estiver em WSS
        if (!isGuest && !p2pReady && p2pAttempts < 4 && now - lastP2PAttemptTime > 5500) {
          initiateHostP2P();
        }

        if (p2pReady && now - lastFastRecv > 2600) {
          p2pReady = false;
          updateHud();
        }

        if (p2pReady && fastDC && fastDC.readyState === 'open') {
          try { fastDC.send(JSON.stringify({ t: 'p2p_probe', ts: now })); } catch (_) {}
        } else {
          sendMqtt({ t: 'ping', ts: now });
        }
      }
    }, 650);

    function loop() {
      stepFrame();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
